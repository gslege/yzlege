name: Daily A-share Report

on:
  schedule:
    # 09:00 UTC == 17:00 Beijing time
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        run: |
          python tools/generate_report.py --output index.html || (echo "Report generation failed or produced placeholder" && exit 0)

      - name: Commit and push report
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "chore(report): daily A-share report - ${{ github.run_id }}"
          add: 'index.html'
          push: true
